<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Kết hợp A + C – Điện thoại bác sĩ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B1F17}a:hover{color:#17803D}
:focus-visible{outline:3px solid #17803D;outline-offset:2px}
</style>
</helmet>
<div style="position: relative; overflow: hidden; width: 390px; height: 844px; box-sizing: border-box; font-family: 'Be Vietnam Pro', system-ui, sans-serif; color: #0B1F17; background: radial-gradient(circle at 15% 10%, #7FE0A8 0%, rgba(127,224,168,0) 45%), radial-gradient(circle at 95% 30%, #8EC2FF 0%, rgba(142,194,255,0) 45%), radial-gradient(circle at 30% 95%, #C3AEFF 0%, rgba(195,174,255,0) 45%), linear-gradient(170deg, #DCF3E7 0%, #E6ECFB 100%); display: flex; flex-direction: column">
  <header style="padding: 22px 16px 12px; display: flex; flex-direction: column; gap: 12px">
    <div style="position: relative; overflow: hidden; border-radius: 28px; padding: 20px; background: rgba(23,128,61,0.74); color: #FFFFFF; border: 1px solid rgba(255,255,255,0.45); box-shadow: inset 0 1px 0 rgba(255,255,255,0.55), 0 18px 40px rgba(10,60,30,0.3); backdrop-filter: blur(24px) saturate(170%); display: flex; flex-direction: column; gap: 4px">
      <svg aria-hidden="true" width="150" height="150" viewBox="0 0 100 100" style="position: absolute; right: -36px; top: -36px; opacity: 0.2"><path fill="#FFFFFF" d="M50 2l9 12 15-4 2 15 14 6-6 14 8 13-13 8 1 15-15 1-8 13-12-9-13 6-5-14-15-3 3-15-11-10 11-10-3-15 15-3 5-14 13 6z"></path></svg>
      <span style="font-size: 13px; opacity: 0.9">BS. Phạm Văn Hòa · Nội 1</span>
      <strong style="font-size: 34px; font-weight: 900; letter-spacing: -1px">Hàng chờ</strong>
      <span style="font-size: 14px">4 chờ khám · 2 có kết quả</span>
    </div>
    <label style="display: flex; align-items: center; gap: 12px; height: 54px; padding: 0 20px; border-radius: 999px; background: rgba(255,255,255,0.5); border: 1px solid rgba(255,255,255,0.85); box-shadow: inset 0 1px 0 #FFFFFF; backdrop-filter: blur(22px) saturate(180%)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1F3A31" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <input aria-label="Tìm người bệnh" placeholder="Tìm người bệnh" style="flex: 1; border: 0; background: transparent; font: inherit; font-size: 16px; outline: none">
    </label>
  </header>
  <div style="flex: 1; overflow: auto; padding: 0 16px 110px; display: flex; flex-direction: column; gap: 8px">
    <sc-for list="{{cards}}" as="c" hint-placeholder-count="4">
      <a href="#" style="display: flex; gap: 12px; align-items: center; padding: 14px; border-radius: 28px; text-decoration: none; color: #0B1F17; border: 1px solid rgba(255,255,255,0.8); box-shadow: inset 0 1px 0 #FFFFFF, 0 10px 26px rgba(16,40,30,0.12); backdrop-filter: blur(22px) saturate(180%); {{c.bg}}">
        <span style="width: 50px; height: 50px; border-radius: 20px; background: {{c.numBg}}; color: {{c.numFg}}; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 18px">{{c.no}}</span>
        <span style="display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0">
          <strong style="font-size: 16px; font-weight: 800">{{c.name}}</strong>
          <span style="font-size: 13px; color: #1F3A31">{{c.info}}</span>
          <sc-if value="{{c.allergy}}" hint-placeholder-val="{{ false }}">
            <span style="align-self: flex-start; margin-top: 3px; font-size: 12px; padding: 3px 10px; border-radius: 10px; background: #FFDAD4; color: #8C1D18; font-weight: 800">{{c.allergy}}</span>
          </sc-if>
        </span>
      </a>
    </sc-for>
  </div>
  <div style="position: absolute; left: 16px; right: 16px; bottom: 22px; display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 999px; background: rgba(255,255,255,0.5); border: 1px solid rgba(255,255,255,0.85); box-shadow: inset 0 1px 0 #FFFFFF, 0 18px 40px rgba(16,40,30,0.22); backdrop-filter: blur(26px) saturate(190%)">
    <a href="#" style="flex: 1; text-align: center; padding: 12px 0; border-radius: 999px; background: rgba(255,255,255,0.9); text-decoration: none; font-weight: 800; font-size: 14px">Chờ</a>
    <a href="#" style="flex: 1; text-align: center; padding: 12px 0; border-radius: 999px; text-decoration: none; font-weight: 600; font-size: 14px">Kết quả</a>
    <button style="flex: 1.4; height: 48px; border: 0; border-radius: 999px; background: rgba(23,128,61,0.92); color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 900">Gọi tiếp</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      cards: [
        { no: '19', name: 'Trần Văn Minh', info: '45t · Đau thượng vị · Đang khám', allergy: 'Dị ứng: Amoxicillin', bg: 'background:rgba(255,255,255,0.72)', numBg: '#17803D', numFg: '#FFFFFF' },
        { no: '21', name: 'Hoàng Văn Nam', info: '32t · Có kết quả xét nghiệm', allergy: '', bg: 'background:rgba(255,255,255,0.45)', numBg: '#FFD8A8', numFg: '#4A2800' },
        { no: '23', name: 'Bùi Thị Mai', info: '61t · Tái khám huyết áp', allergy: '', bg: 'background:rgba(255,255,255,0.45)', numBg: 'rgba(255,255,255,0.9)', numFg: '#0B1F17' },
        { no: '24', name: 'Đỗ Minh Khang', info: '8t · Ho, sốt 2 ngày', allergy: '', bg: 'background:rgba(255,255,255,0.45)', numBg: 'rgba(255,255,255,0.9)', numFg: '#0B1F17' }
      ]
    };
  }
}
</script>
</body>
</html>
