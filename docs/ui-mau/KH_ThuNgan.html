<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>A + C – Thu ngân</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4EEDF}
a{color:#0B1F17}a:hover{color:#008249}
:focus-visible{outline:3px solid #008249;outline-offset:2px}
</style>
</helmet>
<div style="position: relative; overflow: hidden; min-height: 820px; padding: 22px 26px; box-sizing: border-box; font-family: 'Be Vietnam Pro', system-ui, sans-serif; color: #0B1F17; background: radial-gradient(circle at 15% 15%, #FFD9A0 0%, rgba(255,217,160,0) 40%), radial-gradient(circle at 85% 10%, #7FE0A8 0%, rgba(127,224,168,0) 40%), radial-gradient(circle at 60% 95%, #8EC2FF 0%, rgba(142,194,255,0) 40%), linear-gradient(160deg, #F6EEDC 0%, #E2F3EA 55%, #E3EEFB 100%); display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; align-content: start">
  <section style="grid-column: span 5; display: flex; flex-direction: column; gap: 10px">
    <h1 style="margin: 0; font-size: 44px; line-height: 1; font-weight: 900; letter-spacing: -1px">Thu tiền</h1>
    <span style="font-size: 14px; color: #1F3A31">5 lượt chờ thu · ca sáng 12/11</span>
    <sc-for list="{{dues}}" as="d" hint-placeholder-count="4">
      <a href="#" style="display: flex; align-items: center; gap: 12px; padding: 16px; border-radius: 28px; text-decoration: none; color: #0B1F17; border: 1px solid rgba(255,255,255,0.85); box-shadow: inset 0 1px 0 #FFFFFF, 0 10px 26px rgba(40,30,10,0.1); backdrop-filter: blur(22px) saturate(180%); {{d.bg}}">
        <span style="width: 46px; height: 46px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: 900; {{d.num}}">{{d.no}}</span>
        <span style="display: flex; flex-direction: column; flex: 1"><strong style="font-size: 16px">{{d.name}}</strong><span style="font-size: 13px; color: #1F3A31">{{d.what}}</span></span>
        <strong style="font-size: 18px; font-weight: 900">{{d.amount}}</strong>
      </a>
    </sc-for>
  </section>

  <section style="grid-column: span 7; display: flex; flex-direction: column; gap: 14px">
    <div style="position: relative; overflow: hidden; border-radius: 40px; padding: 28px; display: flex; flex-direction: column; gap: 8px; background: rgba(0,118,66,0.9); color: #FFFFFF; border: 1px solid rgba(255,255,255,0.45); box-shadow: inset 0 1px 0 rgba(255,255,255,0.55), 0 24px 50px rgba(10,60,30,0.3); backdrop-filter: blur(26px) saturate(170%)">
      <svg aria-hidden="true" width="220" height="220" viewBox="0 0 100 100" style="position: absolute; right: -50px; bottom: -60px; opacity: 0.18"><path fill="#FFFFFF" d="M50 2l9 12 15-4 2 15 14 6-6 14 8 13-13 8 1 15-15 1-8 13-12-9-13 6-5-14-15-3 3-15-11-10 11-10-3-15 15-3 5-14 13 6z"></path></svg>
      <span style="font-size: 15px">Hoàng Văn Nam · Số 21 · Mã NB 2026-000192</span>
      <span style="font-size: 14px">Cần thu</span>
      <strong style="font-size: 64px; line-height: 1; font-weight: 900; letter-spacing: -1.5px">320.000 đ</strong>
    </div>
    <div style="border-radius: 28px; padding: 10px; display: flex; flex-direction: column; gap: 4px; background: rgba(255,255,255,0.45); border: 1px solid rgba(255,255,255,0.85); box-shadow: inset 0 1px 0 #FFFFFF, 0 16px 40px rgba(40,30,10,0.12); backdrop-filter: blur(26px) saturate(180%)">
      <sc-for list="{{lines}}" as="l" hint-placeholder-count="3">
        <div style="display: flex; align-items: center; padding: 12px 16px; border-radius: 20px; background: rgba(255,255,255,0.55)">
          <span style="font-size: 15px">{{l.name}}</span>
          <strong style="margin-left: auto; font-size: 16px">{{l.price}}</strong>
        </div>
      </sc-for>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 10px">
      <span style="font-size: 14px; font-weight: 700; align-self: center">Hình thức</span>
      <button style="height: 52px; padding: 0 22px; border: 0; border-radius: 20px; background: #0B1F17; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 800">Tiền mặt</button>
      <button style="height: 52px; padding: 0 22px; border: 1px solid rgba(255,255,255,0.9); border-radius: 999px; background: rgba(255,255,255,0.55); font: inherit; font-size: 16px; font-weight: 800">Chuyển khoản</button>
      <label style="flex: 1 1 200px; display: flex; flex-direction: column; gap: 2px; padding: 8px 18px; border-radius: 20px; background: rgba(255,255,255,0.65); border: 1px solid rgba(255,255,255,0.9); font-size: 13px; color: #1F3A31">Khách đưa
        <input value="500.000" style="border: 0; background: transparent; font: inherit; font-size: 20px; font-weight: 900; color: #0B1F17; padding: 0; outline: none">
      </label>
      <span style="display: flex; flex-direction: column; justify-content: center; padding: 8px 18px; border-radius: 20px; background: rgba(255,216,168,0.85); font-size: 13px; color: #4A2800">Trả lại<strong style="font-size: 20px; font-weight: 900">180.000 đ</strong></span>
    </div>
    <div style="display: flex; gap: 10px; justify-content: flex-end">
      <button style="height: 58px; padding: 0 24px; border: 1px solid rgba(255,255,255,0.9); border-radius: 999px; background: rgba(255,255,255,0.6); font: inherit; font-size: 16px; font-weight: 800">In phiếu thu</button>
      <button style="height: 58px; padding: 0 30px; border: 0; border-radius: 999px; background: #008249; color: #FFFFFF; font: inherit; font-size: 17px; font-weight: 900; box-shadow: inset 0 1px 0 rgba(255,255,255,0.5), 0 12px 26px rgba(0,130,73,0.32)">Xác nhận đã thu</button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1366,"height":820}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      dues: [
        { no: '21', name: 'Hoàng Văn Nam', what: 'Khám nội · Sinh hóa máu', amount: '320.000 đ', bg: 'background:rgba(255,255,255,0.8)', num: 'background:#008249;color:#FFFFFF' },
        { no: '22', name: 'Lý Thị Hạnh', what: 'Nước tiểu', amount: '60.000 đ', bg: 'background:rgba(255,255,255,0.45)', num: 'background:rgba(255,255,255,0.9);color:#0B1F17' },
        { no: '24', name: 'Đỗ Minh Khang', what: 'Khám nội', amount: '150.000 đ', bg: 'background:rgba(255,255,255,0.45)', num: 'background:rgba(255,255,255,0.9);color:#0B1F17' },
        { no: '20', name: 'Vũ Ngọc Bích', what: 'Siêu âm ổ bụng', amount: '200.000 đ', bg: 'background:rgba(255,255,255,0.45)', num: 'background:rgba(255,255,255,0.9);color:#0B1F17' }
      ],
      lines: [
        { name: 'Khám nội', price: '150.000 đ' },
        { name: 'Sinh hóa máu (6 chỉ số)', price: '170.000 đ' }
      ]
    };
  }
}
</script>
</body>
</html>
