# PostgreSQL 17 / Windows 11 Pro / 8 GB RAM / SSD 256 GB.
# Reviewed include file, applied by an administrator after backup. Restart PG.
# Memory estimates are guidance, not a hard process-wide RAM cap.
listen_addresses = '127.0.0.1'
max_connections = 20
shared_buffers = '128MB'
effective_cache_size = '2GB'
work_mem = '4MB'
hash_mem_multiplier = 1.0
maintenance_work_mem = '64MB'
autovacuum_work_mem = '32MB'
autovacuum_max_workers = 2
max_parallel_workers_per_gather = 0
max_parallel_maintenance_workers = 0
max_worker_processes = 4
max_parallel_workers = 2
temp_file_limit = '256MB'
wal_buffers = '8MB'
min_wal_size = '80MB'
max_wal_size = '512MB'
wal_keep_size = 0
max_slot_wal_keep_size = '512MB'
checkpoint_timeout = '10min'
checkpoint_completion_target = 0.9
# Never weaken crash durability or security to improve benchmark results.
fsync = on
synchronous_commit = on
full_page_writes = on
autovacuum = on
password_encryption = 'scram-sha-256'
idle_in_transaction_session_timeout = '60s'
logging_collector = on
log_destination = 'stderr'
log_directory = 'log'
# Seven daily names reused weekly; size is monitored, not claimed as a byte cap.
log_filename = 'minhduc-%a.log'
log_rotation_age = '1d'
log_rotation_size = 0
log_truncate_on_rotation = on
log_min_messages = warning
log_min_error_statement = panic
log_statement = 'none'
log_duration = off
log_parameter_max_length = 0
log_parameter_max_length_on_error = 0
