      - name: CAI_DAT.bat second run keeps data, passwords, keys and certificate
        shell: cmd
        run: call C:\MinhDuc\deploy\windows\CAI_DAT.bat -KhongHoi -ChapNhanIPDong -PageFile Giu
      - name: Verify second run changed nothing important
        run: |
          if ((Get-FileHash C:\ProgramData\MinhDuc\clinic.env).Hash -ne $env:ENV_HASH) { throw 'clinic.env changed' }
          if ((Get-FileHash C:\ProgramData\MinhDuc\quantri\backup.key).Hash -ne $env:KEY_HASH) { throw 'backup key changed' }
          if ((Get-FileHash C:\ProgramData\MinhDuc\tls\ca.crt).Hash -ne $env:CA_HASH) { throw 'CA changed' }
          $now = & C:\MinhDuc\.venv\Scripts\python.exe .github\scripts\windows_e2e.py count | Select-Object -Last 1
          if ($now -ne $env:COUNT_BEFORE) { throw "Data changed: $now vs $env:COUNT_BEFORE" }
          & C:\MinhDuc\.venv\Scripts\python.exe .github\scripts\windows_e2e.py login; if ($LASTEXITCODE) { throw 'login after rerun' }
          Write-Output 'PASS: chay CAI_DAT lan hai khong mat du lieu, khong doi mat khau/khoa/chung chi'
      - name: GIA_HAN_CHUNG_CHI.bat renews the server certificate with the existing CA
        run: |
          $py = 'C:\MinhDuc\.venv\Scripts\python.exe'
          $origin = ((Get-Content C:\ProgramData\MinhDuc\clinic.env) -match '^CLINIC_ORIGIN=') -replace '^CLINIC_ORIGIN=',''
          Push-Location C:\MinhDuc
          $before = (& $py -m scripts.install_cert served --origin $origin --ca C:\ProgramData\MinhDuc\tls\ca.crt | ConvertFrom-Json).serial
          Pop-Location
          & cmd /c "call C:\MinhDuc\deploy\windows\GIA_HAN_CHUNG_CHI.bat -KhongHoi"
          if ($LASTEXITCODE -ne 0) { throw "GIA_HAN_CHUNG_CHI exit $LASTEXITCODE" }
          $r = Get-Content C:\ProgramData\MinhDuc\nhatky\ket-qua-gia-han.json -Raw | ConvertFrom-Json
          if ($r.status -ne 'thanh_cong') { throw "Renewal status $($r.status): $($r.detail)" }
          Push-Location C:\MinhDuc
          $after = (& $py -m scripts.install_cert served --origin $origin --ca C:\ProgramData\MinhDuc\tls\ca.crt | ConvertFrom-Json).serial
          Pop-Location
          if (-not $after -or $after -eq $before) { throw "Served certificate did not change ($before -> $after)" }
          if ((Get-FileHash C:\ProgramData\MinhDuc\tls\ca.crt).Hash -ne $env:CA_HASH) { throw 'CA changed: workstations would need reinstall' }
          if (-not (Test-Path C:\ProgramData\MinhDuc\tls\server.crt.cu-*)) { throw 'Old certificate not kept' }
          & $py .github\scripts\windows_e2e.py login; if ($LASTEXITCODE) { throw 'login after renewal' }
          Write-Output "PASS: gia han chung chi ($before -> $after), CA giu nguyen, may tram van tin cay, dang nhap duoc"
      - name: GIA_HAN_CHUNG_CHI fault injection (deny key read, failure mid-swap, failed restore)
        run: |
          $py = 'C:\MinhDuc\.venv\Scripts\python.exe'
          $origin = ((Get-Content C:\ProgramData\MinhDuc\clinic.env) -match '^CLINIC_ORIGIN=') -replace '^CLINIC_ORIGIN=',''
          function Served { Push-Location C:\MinhDuc; $s = (& $py -m scripts.install_cert served --origin $origin --ca C:\ProgramData\MinhDuc\tls\ca.crt | ConvertFrom-Json).serial; Pop-Location; return $s }
          function GiaHan([string]$fault) {
            if ($fault) { $env:MINHDUC_TEST_LOI = $fault } else { Remove-Item Env:\MINHDUC_TEST_LOI -ErrorAction SilentlyContinue }
            & cmd /c "call C:\MinhDuc\deploy\windows\GIA_HAN_CHUNG_CHI.bat -KhongHoi" | Out-Host
            $code = $LASTEXITCODE
            Remove-Item Env:\MINHDUC_TEST_LOI -ErrorAction SilentlyContinue
            $status = (Get-Content C:\ProgramData\MinhDuc\nhatky\ket-qua-gia-han.json -Raw | ConvertFrom-Json).status
            return @($code, $status)
          }
          foreach ($fault in 'tu-choi-doc-khoa', 'loi-giua-thay') {
            $before = Served
            $code, $status = GiaHan $fault
            $after = Served
            if ($code -ne 50 -or $status -ne 'da_tra_chung_chi_cu') { throw "$fault -> exit $code status $status (expected 50 / da_tra_chung_chi_cu)" }
            if ($after -ne $before) { throw "$fault -> served certificate changed ($before -> $after)" }
            if (Get-ChildItem C:\ProgramData\MinhDuc\tls -Filter '*.moi-*') { throw "$fault -> temporary files left" }
            Write-Output "PASS: $fault -> da tra chung chi cu, HTTPS van dung chung chi $after"
          }
          $code, $status = GiaHan 'khoi-phuc-loi'
          if ($code -ne 51 -or $status -ne 'khoi_phuc_that_bai') { throw "khoi-phuc-loi -> exit $code status $status (expected 51 / khoi_phuc_that_bai)" }
          Write-Output 'PASS: khoi-phuc-loi -> bao KHONG DAT (ma 51), khong bao sai la da tra chung chi cu'
          $code, $status = GiaHan ''
          if ($code -ne 0 -or $status -ne 'thanh_cong') { throw "recovery run -> exit $code status $status" }
          if ((Get-FileHash C:\ProgramData\MinhDuc\tls\ca.crt).Hash -ne $env:CA_HASH) { throw 'CA changed' }
          & $py .github\scripts\windows_e2e.py login; if ($LASTEXITCODE) { throw 'login after fault tests' }
          Write-Output 'PASS: chay lai GIA_HAN sau loi khoi phuc -> thanh cong, CA giu nguyen, dang nhap duoc'
      - name: GIA_HAN_CHUNG_CHI recovery mode (certificate missing, damaged; CA key missing)
        run: |
          $py = 'C:\MinhDuc\.venv\Scripts\python.exe'
          $tls = 'C:\ProgramData\MinhDuc\tls'
          $q = 'C:\ProgramData\MinhDuc\quantri'
          $origin = ((Get-Content C:\ProgramData\MinhDuc\clinic.env) -match '^CLINIC_ORIGIN=') -replace '^CLINIC_ORIGIN=',''
          function Served { Push-Location C:\MinhDuc; $s = (& $py -m scripts.install_cert served --origin $origin --ca "$tls\ca.crt" | ConvertFrom-Json).serial; Pop-Location; return $s }
          function GiaHan {
            & cmd /c "call C:\MinhDuc\deploy\windows\GIA_HAN_CHUNG_CHI.bat -KhongHoi" | Out-Host
            $code = $LASTEXITCODE
            $status = (Get-Content C:\ProgramData\MinhDuc\nhatky\ket-qua-gia-han.json -Raw | ConvertFrom-Json).status
            return @($code, $status)
          }
          # 1. server.crt and server.key deleted: recovery issues a new pair from the existing ca.key.
          $before = Served
          Remove-Item "$tls\server.crt", "$tls\server.key" -Force
          $code, $status = GiaHan
          if ($code -ne 0 -or $status -ne 'thanh_cong') { throw "missing cert -> exit $code status $status" }
          $after = Served
          if (-not $after -or $after -eq $before) { throw "missing cert -> served $before -> $after" }
          if ((Get-FileHash "$tls\ca.crt").Hash -ne $env:CA_HASH) { throw 'CA changed' }
          & $py .github\scripts\windows_e2e.py login; if ($LASTEXITCODE) { throw 'login after recovery (missing)' }
          Write-Output "PASS: thieu chung chi -> che do phuc hoi tu ca.key ($before -> $after), CA giu nguyen, dang nhap duoc"
          # 2. Damaged certificate AND ca.key missing: stop (exit 5), nothing replaced.
          Rename-Item "$q\ca.key" 'ca.key.ci-giu'
          [IO.File]::WriteAllText("$tls\server.crt", 'hong')
          $code, $status = GiaHan
          if ($code -ne 5 -or $status -ne 'dung') { throw "lost ca.key -> exit $code status $status (expected 5 / dung)" }
          if ([IO.File]::ReadAllText("$tls\server.crt") -ne 'hong') { throw 'damaged certificate was touched without ca.key' }
          if (Get-ChildItem $tls -Filter '*.moi-*') { throw 'temporary files left' }
          Write-Output 'PASS: hong chung chi + mat ca.key -> dung (ma 5), bao phai cai lai CA cho moi may tram, khong thay tep nao'
          # 3. ca.key back: recovery from the damaged certificate without reading it.
          Rename-Item "$q\ca.key.ci-giu" 'ca.key'
          $code, $status = GiaHan
          if ($code -ne 0 -or $status -ne 'thanh_cong') { throw "damaged cert -> exit $code status $status" }
          $fixed = Served
          if (-not $fixed -or $fixed -eq $after) { throw "damaged cert -> served $after -> $fixed" }
          if (-not (Get-ChildItem $tls -Filter 'server.crt.cu-*' | Where-Object { [IO.File]::ReadAllText($_.FullName) -eq 'hong' })) { throw 'damaged file not kept' }
          if ((Get-FileHash "$tls\ca.crt").Hash -ne $env:CA_HASH) { throw 'CA changed' }
          & $py .github\scripts\windows_e2e.py login; if ($LASTEXITCODE) { throw 'login after recovery (damaged)' }
          Write-Output "PASS: chung chi hong -> phuc hoi tu ca.key ($after -> $fixed), giu tep hong de doi chieu, dang nhap duoc"
