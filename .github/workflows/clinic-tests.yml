name: Clinic synthetic LAN tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-bookworm@sha256:665dc7b37ac52a17e298511414c21d23ffa4e6a6ef6225b3e5d59c7afb35e994
        env:
          POSTGRES_USER: clinic
          POSTGRES_PASSWORD: ci-synthetic-only-not-a-deployment-secret
          POSTGRES_DB: clinic_test_source
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd "pg_isready -U clinic -d clinic_test_source" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.lock
      - run: pip install -r requirements-test.lock
      - name: Ubuntu mirror and apt retry settings
        run: |
          sudo sed -i 's|https\?://security.ubuntu.com/ubuntu|http://azure.archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          echo 'Acquire::Retries "5"; Acquire::http::Timeout "30"; Acquire::https::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/80-retries
      - name: Chromium dependencies and browser
        run: |
          for attempt in 1 2 3; do
            if python -m playwright install-deps chromium; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 20
          done
          python -m playwright install chromium
      - name: Install matching PostgreSQL client from the signed official repository
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
          echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          for attempt in 1 2 3; do
            if sudo apt-get update; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 20
          done
          for attempt in 1 2 3; do
            if sudo apt-get install -y postgresql-client-17 fonts-dejavu-core; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 20
          done
      - run: python -m pytest tests -q --junitxml=test_evidence/demo-junit.xml
      - name: PostgreSQL, HTTPS, concurrent roles and encrypted restore
        env:
          CLINIC_TEST_DATABASE_URL: postgresql://clinic:ci-synthetic-only-not-a-deployment-secret@127.0.0.1:5432/clinic_test_source
        run: |
          export CHROMIUM_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          python -m pytest lan_tests -q --junitxml=test_evidence/lan-junit.xml
      - run: sha256sum -c docs/assets-v031.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-clinic-test-evidence
          path: test_evidence/
          retention-days: 7
  browser-chromium-109:
    # Workstations run Windows 7 SP1, whose last Chrome is 109. Run the existing
    # real-HTTPS browser tests (JS errors fail the test) and the TLS check with
    # Chromium 109 + Playwright 1.29.1 (the Playwright release built for it).
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-bookworm@sha256:665dc7b37ac52a17e298511414c21d23ffa4e6a6ef6225b3e5d59c7afb35e994
        env:
          POSTGRES_USER: clinic
          POSTGRES_PASSWORD: ci-synthetic-only-not-a-deployment-secret
          POSTGRES_DB: clinic_test_source
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd "pg_isready -U clinic -d clinic_test_source" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'   # greenlet 2.0.1 required by Playwright 1.29 has no 3.12 build
      - name: Test dependencies with Playwright 1.29.1
        run: |
          grep -v -E '^(playwright|greenlet|pyee)==' requirements-test.lock > /tmp/req-c109.txt
          pip install -r /tmp/req-c109.txt
          pip install playwright==1.29.1
      - name: Ubuntu mirror and apt retry settings
        run: |
          sudo sed -i 's|https\?://security.ubuntu.com/ubuntu|http://azure.archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          echo 'Acquire::Retries "5"; Acquire::http::Timeout "30"; Acquire::https::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/80-retries
      - name: Chromium 109 (Playwright build 109.0.5414.46, else pinned Chromium snapshot 109.0.5414.0)
        run: |
          for attempt in 1 2 3; do
            if pipx run --spec playwright==1.64.1 playwright install-deps chromium; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 20
          done
          if PLAYWRIGHT_DOWNLOAD_HOST=https://cdn.playwright.dev/dbazure/download/playwright python -m playwright install chromium; then
            CHROME="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          else
            curl -fsSL -o /tmp/c109.zip https://commondatastorage.googleapis.com/chromium-browser-snapshots/Linux_x64/1070103/chrome-linux.zip
            echo 'd1329dd82aa9196d4b5c2e1ec7429d5500db5bf14c750e53f73603df2e4229fd  /tmp/c109.zip' | sha256sum -c -
            unzip -q /tmp/c109.zip -d /tmp/c109
            CHROME=/tmp/c109/chrome-linux/chrome
          fi
          "$CHROME" --version --no-sandbox
          echo "CHROMIUM_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: Install matching PostgreSQL client from the signed official repository
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
          echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          for attempt in 1 2 3; do
            if sudo apt-get update; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 20
          done
          for attempt in 1 2 3; do
            if sudo apt-get install -y postgresql-client-17 fonts-dejavu-core; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 20
          done
      - name: Real HTTPS UI workflows and TLS on Chromium 109
        env:
          CLINIC_TEST_DATABASE_URL: postgresql://clinic:ci-synthetic-only-not-a-deployment-secret@127.0.0.1:5432/clinic_test_source
          MINHDUC_EXPECT_CHROMIUM_MAJOR: '109'
        run: python -m pytest lan_tests/test_browser_https.py lan_tests/test_v050_browser.py lan_tests/test_tls_chrome_compat.py lan_tests/test_price_import.py lan_tests/test_manual_prices.py lan_tests/test_manager_visits.py lan_tests/test_mot_ngay_kham.py lan_tests/test_c5_queue_pages.py lan_tests/test_pending_queues.py lan_tests/test_m0_browser.py lan_tests/test_administrative_browser.py lan_tests/test_m6_browser.py lan_tests/test_m5_browser.py lan_tests/test_d0_browser.py lan_tests/test_d0_source_browser.py lan_tests/test_s1_retry_browser.py -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chromium-109-evidence
          path: test_evidence/
          retention-days: 7
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pip-audit==2.10.1
      - run: pip-audit -r requirements.lock --no-deps --disable-pip
  windows-preflight:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Windows interprocess operational log rotation
        shell: python
        run: |
          import pathlib, subprocess, sys, tempfile
          code = "import logging,sys\nfrom app.logging_config import LockedRotatingFileHandler\nh=LockedRotatingFileHandler(sys.argv[1],maxBytes=1024,backupCount=3,encoding='utf-8')\nl=logging.getLogger('fake');l.addHandler(h);l.setLevel(logging.WARNING)\nfor i in range(80):l.warning('Synthetic Windows log %s %s',i,'x'*70)\nh.close()"
          with tempfile.TemporaryDirectory() as folder:
              path = pathlib.Path(folder) / 'server.log'
              processes = [subprocess.Popen([sys.executable, '-c', code, str(path)], stderr=subprocess.PIPE) for _ in range(3)]
              for process in processes:
                  _, errors = process.communicate(timeout=30)
                  assert process.returncode == 0 and not errors, errors
              files = [p for p in pathlib.Path(folder).glob('server.log*') if p.suffix != '.lock']
              assert len(files) <= 4 and sum(p.stat().st_size for p in files) <= 4096
          print('PASS: Windows three-process log rotation')
      - name: PowerShell 5.1 parser and synthetic resource checks
        shell: powershell
        run: .\deploy\windows\Test-Preflight.ps1
      - name: Five public D0 sources, exact hashes and fail-before-write packaging
        shell: powershell
        run: .\deploy\windows\Test-DanhMucGoc.ps1
      - name: Read-only inventory smoke on hosted Windows (not clinic hardware)
        shell: powershell
        run: |
          $reportPath = Join-Path $env:RUNNER_TEMP 'minhduc-preflight.json'
          & powershell.exe -NoProfile -File .\deploy\windows\Preflight.ps1 -Root $env:GITHUB_WORKSPACE -OutputPath $reportPath
          if ($LASTEXITCODE -notin @(0,2)) { throw 'Preflight execution failed' }
          $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
          if ($report.source -ne 'WINDOWS_READ_ONLY') { throw 'Invalid report source' }
          if ($report.snapshot.os.PSObject.Properties.Name -contains 'SerialNumber') { throw 'Forbidden identifier' }
          Write-Output ('Read-only Windows smoke completed: ' + $report.assessment.overall)
          $global:LASTEXITCODE = 0
  windows-install-e2e:
    # Real end-to-end install on a clean hosted Windows VM (not clinic hardware):
    # CAI_DAT -> service/HTTPS/login -> backup+restore -> CAP_NHAT (ok + forced
    # rollback) -> CAI_DAT again without data/password change -> KIEM_TRA.
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Installer logic checks (PowerShell 5.1)
        run: .\deploy\windows\Test-Installer.ps1
      - name: Synthetic CI administrator credential (masked, never committed)
        run: |
          $pw = [guid]::NewGuid().ToString('N') + 'Ci!9x'
          Write-Output "::add-mask::$pw"
          Add-Content -Path $env:GITHUB_ENV -Value "MINHDUC_ADMIN_PASSWORD=$pw"
          Add-Content -Path $env:GITHUB_ENV -Value "MINHDUC_ADMIN_USER=quantri.ci"
      - name: Remove the runner image PostgreSQL so the silent install path is exercised
        run: |
          Get-Service -Name 'postgresql*' -ErrorAction SilentlyContinue | ForEach-Object {
            Stop-Service $_.Name -Force -ErrorAction SilentlyContinue
            sc.exe delete $_.Name | Out-Null
          }
          Get-ChildItem 'C:\Program Files\PostgreSQL' -Directory -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Output ("Removing preinstalled " + $_.FullName)
            Remove-Item $_.FullName -Recurse -Force -ErrorAction SilentlyContinue
          }
          Remove-Item 'HKLM:\SOFTWARE\PostgreSQL' -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall' | Where-Object { $_.PSChildName -like 'PostgreSQL*' } | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          $global:LASTEXITCODE = 0
      - name: CAI_DAT.bat (first run, unattended; only the backup row may fail with 1 of 3 verified backups)
        shell: cmd
        env:
          MINHDUC_ADMIN_NAME: Quan tri CI gia lap
        run: |
          call deploy\windows\CAI_DAT.bat -KhongHoi -ChapNhanIPDong -PageFile Giu
          if %errorlevel% equ 0 exit /b 0
          if %errorlevel% neq 40 exit /b %errorlevel%
          C:\MinhDuc\.venv\Scripts\python.exe .github\scripts\windows_e2e.py fresh-install-report
      - name: Service, HTTPS login page, administrator login, synthetic write
        run: |
          $svc = Get-Service MinhDuc
          if ($svc.Status -ne 'Running' -or [string]$svc.StartType -ne 'Automatic') { throw "Service state $($svc.Status) $($svc.StartType)" }
          $acct = (Get-CimInstance Win32_Service -Filter "Name='MinhDuc'").StartName
          if ($acct -ne 'NT SERVICE\MinhDuc') { throw "Service account $acct" }
          Write-Output "PASS: dich vu MinhDuc dang chay, tu khoi dong, tai khoan $acct"
          $py = 'C:\MinhDuc\.venv\Scripts\python.exe'
          & $py .github\scripts\windows_e2e.py login; if ($LASTEXITCODE) { throw 'login' }
          & $py .github\scripts\windows_e2e.py seed; if ($LASTEXITCODE) { throw 'seed' }
          $acl = (icacls C:\ProgramData\MinhDuc\clinic.env) -join "`n"
          if ($acl -match 'Everyone|BUILTIN\\Users|Authenticated Users') { throw "clinic.env ACL too broad: $acl" }
          Write-Output $acl
          $listen = Get-NetTCPConnection -State Listen -LocalPort 5432 | Select-Object -ExpandProperty LocalAddress -Unique
          if (@($listen | Where-Object { $_ -notin @('127.0.0.1','::1') }).Count) { throw "PostgreSQL listens on $listen" }
          Write-Output "PASS: PostgreSQL chi nghe $listen"
          Get-NetFirewallRule -Group MinhDuc | Format-Table DisplayName,Action,Enabled -AutoSize
          Get-ScheduledTask -TaskName 'MinhDuc - Sao luu 20h' | Format-List TaskName,State
      - name: Backup job, verification and restore into a separate empty database
        run: |
          $py = 'C:\MinhDuc\.venv\Scripts\python.exe'
          Push-Location C:\MinhDuc
          & $py -m scripts.with_env C:\ProgramData\MinhDuc\clinic.env scripts.backup_job --key C:\ProgramData\MinhDuc\quantri\backup.key --directory C:\ProgramData\MinhDuc\backups --state C:\ProgramData\MinhDuc\backup-status.json
          if ($LASTEXITCODE) { throw "backup_job exit $LASTEXITCODE" }
          Pop-Location
          & $py .github\scripts\windows_e2e.py restore-test; if ($LASTEXITCODE) { throw 'restore' }
          Start-ScheduledTask -TaskName 'MinhDuc - Sao luu 20h'
          $deadline = (Get-Date).AddMinutes(5)
          do { Start-Sleep 5; $t = Get-ScheduledTask -TaskName 'MinhDuc - Sao luu 20h' } while ($t.State -eq 'Running' -and (Get-Date) -lt $deadline)
          $info = Get-ScheduledTaskInfo -TaskName 'MinhDuc - Sao luu 20h'
          if ($info.LastTaskResult -ne 0) { throw "Scheduled backup as SYSTEM returned $($info.LastTaskResult)" }
          Write-Output 'PASS: lich sao luu chay duoi SYSTEM thanh cong'
      - name: Snapshot before update
        run: |
          & C:\MinhDuc\.venv\Scripts\python.exe .github\scripts\windows_e2e.py count | Tee-Object -Variable before
          Add-Content $env:GITHUB_ENV ("COUNT_BEFORE=" + ($before | Select-Object -Last 1))
          Add-Content $env:GITHUB_ENV ("ENV_HASH=" + (Get-FileHash C:\ProgramData\MinhDuc\clinic.env).Hash)
          Add-Content $env:GITHUB_ENV ("KEY_HASH=" + (Get-FileHash C:\ProgramData\MinhDuc\quantri\backup.key).Hash)
          Add-Content $env:GITHUB_ENV ("CA_HASH=" + (Get-FileHash C:\ProgramData\MinhDuc\tls\ca.crt).Hash)
      - name: Simulate a machine installed by the PR 7 installer (30 local backups) before CAP_NHAT
        run: |
          foreach ($f in 'C:\ProgramData\MinhDuc\clinic.env','C:\ProgramData\MinhDuc\quantri\owner.env') {
            $t = [IO.File]::ReadAllText($f)
            if (-not $t.Contains('CLINIC_BACKUP_KEEP=14')) { throw "Unexpected retention in $f" }
            [IO.File]::WriteAllText($f, $t.Replace('CLINIC_BACKUP_KEEP=14', 'CLINIC_BACKUP_KEEP=30'), (New-Object Text.UTF8Encoding($false)))
          }
          Write-Output 'Retention set back to the old 30 local backups'
      - name: Build update zips (same code, and a deliberately broken one)
        run: |
          git archive --format=zip --prefix=phong-kham-minh-duc-main/ -o "$env:RUNNER_TEMP\minhduc-ok.zip" HEAD
          $b = Join-Path $env:RUNNER_TEMP 'broken'
          git worktree add $b HEAD
          Add-Content "$b\schema.postgresql.sql" "`nCREATE TABLE IF NOT EXISTS ci_probe_update(id integer);"
          Add-Content "$b\app\main.py" "`nraise RuntimeError('CI: ban cap nhat loi co chu dich')"
          Push-Location $b; git add -A; git -c user.name=ci -c user.email=ci@example.invalid commit -qm broken; git archive --format=zip --prefix=phong-kham-minh-duc-main/ -o "$env:RUNNER_TEMP\minhduc-broken.zip" HEAD; Pop-Location
      - name: Build task-registration fault update (restore path remains intact)
        run: |
          $fault = Join-Path $env:RUNNER_TEMP 'task-registration-fault'
          git worktree add --detach $fault HEAD
          $file = Join-Path $fault 'deploy\windows\MinhDuc.Install.psm1'
          $text = [IO.File]::ReadAllText($file)
          $needle = "        Register-ScheduledTask -TaskName (`$script:Names.BackupTask + ' - Chay bu')"
          if (-not $text.Contains($needle)) { throw 'Fault-injection location missing' }
          $text = $text.Replace($needle, "        throw 'CI: task registration failed after daily creation'`r`n" + $needle)
          [IO.File]::WriteAllText($file, $text, (New-Object Text.UTF8Encoding($true)))
          # Change only a function body too: rollback must detect this without a table/version change.
          $migration = Join-Path $fault 'migrations\012_s1_immutable.sql'
          $sql = [IO.File]::ReadAllText($migration)
          $guardLine = "    RAISE EXCEPTION 'Dòng đơn không còn nháp: cấm mọi cập nhật hoặc xóa'"
          if (-not $sql.Contains($guardLine)) { throw 'Immutable guard fault-injection location missing' }
          $sql = $sql.Replace($guardLine, ("    -- CI function-body rollback probe`n" + $guardLine))
          [IO.File]::WriteAllText($migration, $sql, (New-Object Text.UTF8Encoding($false)))
          Push-Location $fault
          git add -A
          git -c user.name=ci -c user.email=ci@example.invalid commit -qm task-registration-fault
          git archive --format=zip --prefix=phong-kham-minh-duc-main/ -o "$env:RUNNER_TEMP\minhduc-task-fault.zip" HEAD
          Pop-Location
      - name: Seed a real installation with one legacy --scheduled backup task
        run: .\.github\scripts\Test-S1BackupTasks.ps1 -Mode Legacy
      - name: CAP_NHAT task-registration failure must roll back (expected exit 50)
        shell: cmd
        run: |
          call C:\MinhDuc\deploy\windows\CAP_NHAT.bat -KhongHoi -TepZip "%RUNNER_TEMP%\minhduc-task-fault.zip"
          if %errorlevel% neq 50 (echo Expected task rollback exit 50, got %errorlevel% & exit /b 1)
          exit /b 0
      - name: Verify exact old task restored, then retain the old-policy upgrade scenario
        run: |
          & .\.github\scripts\Test-S1BackupTasks.ps1 -Mode Restored
          foreach ($f in 'C:\ProgramData\MinhDuc\clinic.env','C:\ProgramData\MinhDuc\quantri\owner.env') {
            $text = [IO.File]::ReadAllText($f)
            [IO.File]::WriteAllText($f, $text.Replace('CLINIC_BACKUP_KEEP=14', 'CLINIC_BACKUP_KEEP=30'), (New-Object Text.UTF8Encoding($false)))
          }
      - name: CAP_NHAT.bat with a valid update
        shell: cmd
        run: call C:\MinhDuc\deploy\windows\CAP_NHAT.bat -KhongHoi -TepZip "%RUNNER_TEMP%\minhduc-ok.zip"
      - name: Verify update result
        run: |
          & .\.github\scripts\Test-S1BackupTasks.ps1 -Mode New
          foreach ($f in 'C:\ProgramData\MinhDuc\clinic.env','C:\ProgramData\MinhDuc\quantri\owner.env') {
            $t = [IO.File]::ReadAllText($f)
            if (-not ($t.Contains("`nCLINIC_BACKUP_KEEP=14`n") -and $t.Contains("`nCLINIC_OFFSITE_KEEP=30`n"))) { throw "Retention not migrated in $f" }
          }
          if ((Get-FileHash C:\ProgramData\MinhDuc\clinic.env).Hash -ne $env:ENV_HASH) { throw 'clinic.env differs beyond the retention policy (password changed?)' }
          Write-Output 'PASS: CAP_NHAT tu chuyen sang giu 14 ban tren may chu, giu nguyen mat khau'
          $r = Get-Content C:\ProgramData\MinhDuc\capnhat\ket-qua-cap-nhat.json -Raw | ConvertFrom-Json
          if ($r.status -ne 'thanh_cong') { throw "Update status $($r.status): $($r.detail)" }
          & C:\MinhDuc\.venv\Scripts\python.exe .github\scripts\windows_e2e.py login; if ($LASTEXITCODE) { throw 'login after update' }
          $now = & C:\MinhDuc\.venv\Scripts\python.exe .github\scripts\windows_e2e.py count | Select-Object -Last 1
          if ($now -ne $env:COUNT_BEFORE) { throw "Data changed by update: $now vs $env:COUNT_BEFORE" }
          Write-Output 'PASS: CAP_NHAT thanh cong, du lieu giu nguyen'
      - name: Administrator saves UI settings over HTTPS before the broken update
        run: |
          & C:\MinhDuc\.venv\Scripts\python.exe .github\scripts\windows_e2e.py settings-set; if ($LASTEXITCODE) { throw 'settings-set' }
      - name: CAP_NHAT.bat with a broken update must roll back (expected exit 50)
        shell: cmd
        run: |
          call C:\MinhDuc\deploy\windows\CAP_NHAT.bat -KhongHoi -TepZip "%RUNNER_TEMP%\minhduc-broken.zip"
          if %errorlevel% neq 50 (echo Expected rollback exit 50, got %errorlevel% & exit /b 1)
          exit /b 0
      - name: Verify rollback restored code, database and service
        run: |
          & .\.github\scripts\Test-S1BackupTasks.ps1 -Mode New
          $r = Get-Content C:\ProgramData\MinhDuc\capnhat\ket-qua-cap-nhat.json -Raw | ConvertFrom-Json
          if ($r.status -ne 'da_quay_ve') { throw "Rollback status $($r.status)" }
          if (Select-String -Path C:\MinhDuc\app\main.py -Pattern 'ban cap nhat loi' -Quiet) { throw 'Broken code still installed' }
          & C:\MinhDuc\.venv\Scripts\python.exe .github\scripts\windows_e2e.py login; if ($LASTEXITCODE) { throw 'login after rollback' }
          $now = & C:\MinhDuc\.venv\Scripts\python.exe .github\scripts\windows_e2e.py count | Select-Object -Last 1
          if ($now -ne $env:COUNT_BEFORE) { throw "Rollback did not restore database: $now vs $env:COUNT_BEFORE" }
          Write-Output 'PASS: CAP_NHAT loi -> tu quay ve ban cu (ma, thu vien, CSDL), dich vu chay lai'
          & C:\MinhDuc\.venv\Scripts\python.exe .github\scripts\windows_e2e.py settings-check; if ($LASTEXITCODE) { throw 'settings after rollback' }
      - name: Rollback CLI nonzero must report quay_ve_that_bai (synthetic VM only)
        run: .\.github\scripts\Test-S1RecoveryFailures.ps1 -Mode Database
      - name: Old service cannot start must report quay_ve_that_bai (synthetic VM only)
        run: .\.github\scripts\Test-S1RecoveryFailures.ps1 -Mode Service
      - name: Simulate a machine installed by the PR 7 installer (30 local backups) before the second CAI_DAT
        run: |
          foreach ($f in 'C:\ProgramData\MinhDuc\clinic.env','C:\ProgramData\MinhDuc\quantri\owner.env') {
            $t = [IO.File]::ReadAllText($f)
            if (-not $t.Contains('CLINIC_BACKUP_KEEP=14')) { throw "Unexpected retention in $f" }
            [IO.File]::WriteAllText($f, $t.Replace('CLINIC_BACKUP_KEEP=14', 'CLINIC_BACKUP_KEEP=30'), (New-Object Text.UTF8Encoding($false)))
